backend:
  name: github
  repo: NicodevC/terraza-web
  branch: main
  base_url: https://terraza-web.vercel.app
  auth_endpoint: api/auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "menu"
    label: "Menu"
    files:
      - name: "main"
        label: "Main Menu"
        file: "src/content/menu/main.json"
        
        description: "Edit the main menu categories and items"
        fields:
          - { name: "platos", label: "Platos", widget: "object", fields: [
              { name: "title", label: "Section Title", widget: "string" },
              { name: "sections", label: "Menu Sections", widget: "list", fields: [
                  { name: "title", label: "Title", widget: "string" },
                  { name: "items", label: "Dishes", widget: "list", fields: [
                      { name: "name", label: "Name", widget: "string" },
                      { name: "price", label: "Price", widget: "string" }
                    ]}
                ]}
            ]}
          - { name: "bebidas", label: "Bebidas", widget: "object", fields: [
              { name: "title", label: "Section Title", widget: "string" },
              { name: "sections", label: "Menu Sections", widget: "list", fields: [
                  { name: "title", label: "Title", widget: "string" },
                  { name: "items", label: "Drinks", widget: "list", fields: [
                      { name: "name", label: "Name", widget: "string" },
                      { name: "price", label: "Price", widget: "string" }
                    ]}
                ]}
            ]}

  - name: "events"
    label: "Music Schedule"
    folder: "src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    fields:
      - { name: "date", label: "Event Date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD MMM", time_format: false }
      - { name: "artist", label: "Artist Name", widget: "string" }
      - { name: "time", label: "Show Time (e.g. 7:00 PM)", widget: "string" }
      - { name: "description", label: "Short Description", widget: "string" }
      - { name: "body", label: "Full Details (Optional)", widget: "markdown", required: false }
