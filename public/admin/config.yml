backend:
  name: github
  repo: tu-usuario/tu-repositorio # <--- ¡CAMBIA ESTO por tu usuario/repo de GitHub!
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

local_backend: true

collections:
  - name: "menu"
    label: "Menu"
    files:
      - name: "main"
        label: "Main Menu"
        file: "src/content/menu/main.json"
        
        description: "Edit the main menu categories and items"
        fields:
          - { name: "platos", label: "Platos", widget: "object", fields: [
              { name: "title", label: "Section Title", widget: "string" },
              { name: "sections", label: "Menu Sections", widget: "list", fields: [
                  { name: "title", label: "Title", widget: "string" },
                  { name: "items", label: "Dishes", widget: "list", fields: [
                      { name: "name", label: "Name", widget: "string" },
                      { name: "price", label: "Price", widget: "string" }
                    ]}
                ]}
            ]}
          - { name: "bebidas", label: "Bebidas", widget: "object", fields: [
              { name: "title", label: "Section Title", widget: "string" },
              { name: "sections", label: "Menu Sections", widget: "list", fields: [
                  { name: "title", label: "Title", widget: "string" },
                  { name: "items", label: "Drinks", widget: "list", fields: [
                      { name: "name", label: "Name", widget: "string" },
                      { name: "price", label: "Price", widget: "string" }
                    ]}
                ]}
            ]}

  - name: "events"
    label: "Music Schedule"
    folder: "src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    fields:
      - { name: "date", label: "Date (e.g. 06 Feb)", widget: "string" }
      - { name: "artist", label: "Artist Name", widget: "string" }
      - { name: "body", label: "Details", widget: "markdown", required: false }
